<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RetroReverse — Studio</title>
  <link rel="stylesheet" href="src/style.css" />
  <script type="importmap">
  {
    "imports": {
      "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.mjs",
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- The top bar: game/category/asset navigation + view controls. Built lean to
       conserve vertical space; the app fills the dynamic slots. -->
  <header id="topbar">
    <button id="homeBtn" class="tb-btn" title="All games">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
    </button>
    <span id="gameTitle" class="tb-title"></span>
    <select id="catSelect" class="tb-select" title="Asset category"></select>
    <select id="assetSelect" class="tb-select tb-grow" title="Asset"></select>
    <select id="variantSelect" class="tb-select" title="Variant" hidden></select>
    <span class="tb-spacer"></span>
    <button id="displayBtn" class="tb-btn" title="Display options" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button id="wireBtn" class="tb-btn" title="Wireframe" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 3v9m0 0l8 4.5M12 12L4 16.5"/></svg>
    </button>
    <button id="sunBtn" class="tb-btn" title="Directional light" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button id="filterBtn" class="tb-btn" title="Screen filter" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8"/></svg>
    </button>
    <button id="infoBtn" class="tb-btn" title="About this asset" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    </button>
    <button id="fsBtn" class="tb-btn" title="Fullscreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    </button>
  </header>

  <!-- Landing page (game cards) and the active view mount. -->
  <main id="landing"></main>
  <main id="stage" hidden></main>

  <!-- Display-options popover (layers/areas/etc), filled by the active view. -->
  <div id="displayPanel" class="popover" hidden></div>

  <!-- Info modal: asset description + technical docs. -->
  <div id="modalBack" class="modal-back" hidden>
    <div id="modal" class="modal">
      <button id="modalClose" class="modal-close" title="Close">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
