name: Browser emulator release checks
on:
  push:
    paths: ['site/emulators/**', 'tools/browser/**', 'tools/platform/**/browser/**', '.github/workflows/emulators.yml']
  pull_request:
    paths: ['site/emulators/**', 'tools/browser/**', 'tools/platform/**/browser/**', '.github/workflows/emulators.yml']
jobs:
  static-and-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 tools/browser/check.py
